<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profile</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="stylesheet" href="./tap-bar/tap-bar.css" />
  </head>
  <body>
    <div class="container">
      <main class="main-size">
        <!-- 1st section - profile -->
        <section class="top-section-flex">
          <div class="profile-picture div-flex">
            <img src="image/profile-picture.jpg" />
          </div>

          <div class="div-flex">
            <p class="title-typography">Jane</p>
            <p class="description-typography">SAN FRANCISCO, CA</p>
          </div>

          <div class="div-flex button-div">
            <button class="solid-button">FOLLOW JANE</button>
            <button class="outline-button">MESSAGE</button>
          </div>
        </section>

        <!-- 2nd section - collage with button-->
        <section class="bottom-section-padding-flex">
          <!-- collage-->
          <div class="collage-grid-div">
            <div class="photo-div-1-1">
              <img src="image/collage-1-1.jpg" alt="collage photo" />
            </div>
            <div class="photo-div-1-2">
              <img src="image/collage-1-2.jpg" alt="collage photo" />
            </div>
            <div class="photo-div-2-1">
              <img src="image/collage-2-1.jpg" alt="collage photo" />
            </div>
            <div class="photo-div-2-2">
              <img src="image/collage-2-2.jpg" alt="collage photo" />
            </div>
            <div class="photo-div-3-1">
              <img src="image/collage-3-1.jpg" alt="collage photo" />
            </div>
            <div class="photo-div-3-2">
              <img src="image/collage-3-2.jpg" alt="collage photo" />
            </div>
          </div>

          <!-- button-->
          <button class="outline-button last-button-size" type="button">
            SEE MORE
          </button>
        </section>
      </main>
      <footer class="tap-bar">
        <a href="/Discover/discover.html" class="tap-bar-link">
          <img src="../tap-bar/img/home.svg" alt="discover" />
        </a>
        <a href="/search-results/search-results.html" class="tap-bar-link">
          <img src="../tap-bar/img/search.svg" alt="search" />
        </a>
        <a href="/index.html" class="tap-bar-link">
          <img src="../tap-bar/img/new.svg" alt="new" />
        </a>
        <a href="/chats/chats.html" class="tap-bar-link">
          <img src="../tap-bar/img/chats.svg" alt="chats" />
        </a>
        <a href="/index.html" class="tap-bar-link">
          <img src="../tap-bar/img/profile.svg" alt="profile" />
        </a>
      </footer>
    </div>
  </body>
</html>

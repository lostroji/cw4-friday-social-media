<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chats</title>
    <link rel="stylesheet" href="chats.css" />
    <link rel="stylesheet" href="../tap-bar/tap-bar.css" />
  </head>

  <body>
    <div class="container">
      <div class="content">
        <header>
          <p class="chat-title">Chats</p>
        </header>

        <article class="chats">
          <section class="james-chat">
            <img
              class="profile-img"
              src="images/James.jpg"
              alt="James profile"
            />
            <div class="chat-info">
              <p class="name"><a href="">James</a></p>
              <p>Thank you! That was very helpful!</p>
            </div>
          </section>

          <section class="Will-Kenny">
            <img
              class="profile-img"
              src="images/Will Kenny.jpg"
              alt="Will Kenny profile"
            />
            <div class="chat-info">
              <p class="name"><a href="">Will Kenny</a></p>
              <p>I know... I'm trying to get the funds.</p>
            </div>
          </section>

          <section class="Beth-Williams">
            <img
              class="profile-img"
              src="images/Beth Williams.jpg"
              alt="Beth Williams profile"
            />
            <div class="chat-info">
              <p class="name"><a href="">Beth Williams</a></p>
              <p>
                I'm looking for tips around capturing the milky way. I have a 6D
                with a 24-100mm...
              </p>
            </div>
          </section>

          <section class="Rev-Shawn">
            <img
              class="profile-img"
              src="images/Rev Shawn.jpg"
              alt="Rev Shawn profile"
            />
            <div class="chat-info">
              <p class="name"><a href="">Rev Shawn</a></p>
              <p>
                Wanted to ask if you're available for a portrait shoot next
                week.
              </p>
            </div>
          </section>
        </article>
      </div>

      <footer class="tap-bar">
        <a href="/Discover/discover.html" class="tap-bar-link">
          <img src="../tap-bar/img/home.svg" alt="discover" />
        </a>
        <a href="/search-results/search-results.html" class="tap-bar-link">
          <img src="../tap-bar/img/search.svg" alt="search" />
        </a>
        <a href="/index.html" class="tap-bar-link">
          <img src="../tap-bar/img/new.svg" alt="new" />
        </a>
        <a href="/chats/chats.html" class="tap-bar-link">
          <img src="../tap-bar/img/chats.svg" alt="chats" />
        </a>
        <a href="/index.html" class="tap-bar-link">
          <img src="../tap-bar/img/profile.svg" alt="profile" />
        </a>
      </footer>
    </div>
  </body>
</html>
